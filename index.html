<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DogsLub — find, hire, and responsibly rehome wonderful dogs." />
  <title>DogsLub | Find your perfect companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--ink:#17221c;--muted:#65736a;--cream:#fffaf0;--green:#24543d;--lime:#d9edb8;--orange:#ed865b;--line:#e6e2d8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.nav{max-width:1180px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:700;font-size:24px;color:var(--green);letter-spacing:-1px}.logo span{color:var(--orange)}nav a{color:var(--ink);text-decoration:none;margin-left:28px;font-size:14px;font-weight:500}.btn{border-radius:999px;padding:13px 21px;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--green);color:white}.secondary{background:var(--lime);color:var(--green)}.hero{max-width:1180px;margin:30px auto 85px;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.eyebrow{color:var(--orange);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:12px}.hero h1{font:800 clamp(46px,6vw,78px)/.98 'Playfair Display',serif;letter-spacing:-3px;margin:18px 0}.hero p{color:var(--muted);font-size:18px;line-height:1.6;max-width:480px}.actions{display:flex;gap:12px;margin-top:28px}.hero-art{min-height:450px;border-radius:45% 45% 18px 18px;background:linear-gradient(145deg,#d3eab0,#f4bd8f);position:relative;overflow:hidden;display:grid;place-items:center}.hero-art .dog{font-size:190px;filter:drop-shadow(5px 15px 8px #a4664840)}.badge{position:absolute;background:#fff;color:var(--green);border-radius:16px;padding:13px 17px;box-shadow:0 10px 30px #17332220;font-size:13px;font-weight:700}.badge.one{top:30px;left:20px}.badge.two{bottom:38px;right:20px}.section{max-width:1180px;margin:auto;padding:0 24px 80px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.section h2{font:700 38px 'Playfair Display',serif;margin:0}.section-head p{color:var(--muted)}.filters{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap}.filters input,.filters select{border:1px solid var(--line);border-radius:12px;background:white;padding:12px 15px;outline:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-5px);box-shadow:0 15px 30px #17332212}.card-image{height:190px;display:grid;place-items:center;font-size:92px}.card-body{padding:18px}.card h3{margin:0 0 6px;font-size:21px}.meta{color:var(--muted);font-size:13px}..price{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--green);font-weight:700}.empty{text-align:center;padding:45px;color:var(--muted);grid-column:1/-1}.banner{background:var(--green);color:white;border-radius:22px;padding:38px 42px;display:flex;justify-content:space-between;align-items:center}.banner h2{font:700 32px 'Playfair Display',serif;margin:0 0 8px}.banner p{margin:0;color:#d6e5d7}.banner .secondary{margin-left:20px}footer{border-top:1px solid var(--line);padding:30px 24px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:760px){nav a{display:none}.hero{grid-template-columns:1fr;margin-top:10px;margin-bottom:55px}.hero-art{min-height:300px}.hero h1{letter-spacing:-2px}.cards{grid-template-columns:1fr}.banner{display:block;padding:28px}.banner .secondary{margin:20px 0 0}.section h2{font-size:30px}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const initialDogs=[
 {id:1,name:'Milo',breed:'Golden Retriever',age:'2 years',place:'Pune, India',type:'Hire',price:'₹1,200 / day',emoji:'🐕',color:'#f7d9a2'},
 {id:2,name:'Luna',breed:'Border Collie',age:'1 year',place:'Bengaluru, India',type:'Adopt',price:'₹18,000',emoji:'🐶',color:'#c8dfef'},
 {id:3,name:'Bruno',breed:'Labrador',age:'3 years',place:'Mumbai, India',type:'Sell',price:'₹25,000',emoji:'🐕‍🦺',color:'#dbc09e'},
 {id:4,name:'Coco',breed:'Beagle',age:'8 months',place:'Delhi, India',type:'Hire',price:'₹900 / day',emoji:'🦮',color:'#f2c4a7'},
 {id:5,name:'Pepper',breed:'Indie',age:'2 years',place:'Chennai, India',type:'Adopt',price:'Free adoption',emoji:'🐕',color:'#c6ddbb'},
 {id:6,name:'Oreo',breed:'Husky',age:'4 years',place:'Hyderabad, India',type:'Sell',price:'₹32,000',emoji:'🐺',color:'#d7d8e5'}
];
function App(){const [dogs,setDogs]=React.useState(initialDogs);const [query,setQuery]=React.useState('');const [type,setType]=React.useState('All');const [notice,setNotice]=React.useState('');const [showForm,setShowForm]=React.useState(false);const filtered=dogs.filter(d=>(type==='All'||d.type===type)&&(`${d.name} ${d.breed} ${d.place}`.toLowerCase().includes(query.toLowerCase())));function enquire(d){setNotice(`Thanks! Your interest in ${d.name} is saved. The owner will contact you soon.`);document.getElementById('dogs').scrollIntoView({behavior:'smooth'})}function addDog(e){e.preventDefault();const f=new FormData(e.target);setDogs([{id:Date.now(),name:f.get('name'),breed:f.get('breed'),age:f.get('age'),place:f.get('place'),type:f.get('type'),price:f.get('price'),emoji:'🐶',color:'#e5d1bc'},...dogs]);setShowForm(false);setNotice('Your dog listing is live on DogsLub!');}return <><header className="nav"><div className="logo">dogs<span>Lub</span> 🐾</div><nav><a href="#dogs">Browse dogs</a><a href="#how">How it works</a><button className="btn primary" onClick={()=>setShowForm(true)}>List a dog</button></nav></header><main><section className="hero"><div><div className="eyebrow">A better way to find a friend</div><h1>Good dogs.<br/><em>Good homes.</em></h1><p>Discover trusted dogs available for adoption, sale, or a little extra company. Every connection starts with care.</p><div className="actions"><a className="btn primary" href="#dogs">Find your dog →</a><button className="btn secondary" onClick={()=>setShowForm(true)}>Share a listing</button></div></div><div className="hero-art"><span className="badge one">✦ 1,200+ happy matches</span><span className="dog">🐶</span><span className="badge two">♥ Loved by dog people</span></div></section><section className="section" id="dogs"><div className="section-head"><div><div className="eyebrow">Meet the pack</div><h2>Find your new best friend</h2></div><p>{filtered.length} dogs available</p></div><div className="filters"><input aria-label="Search dogs" placeholder="Search breed, name or city..." value={query} onChange={e=>setQuery(e.target.value)}/><select value={type} onChange={e=>setType(e.target.value)}><option>All</option><option>Adopt</option><option>Hire</option><option>Sell</option></select></div>{notice&&<div style={{background:'#d9edb8',padding:'14px 18px',borderRadius:12,marginBottom:18,color:'#24543d'}}>{notice}</div>}<div className="cards">{filtered.length?filtered.map(d=><article className="card" key={d.id}><div className="card-image" style={{background:d.color}}>{d.emoji}</div><div className="card-body"><h3>{d.name}</h3><div className="meta">{d.breed} · {d.age}<br/>{d.place} · <b>{d.type}</b></div><div className="price"><span>{d.price}</span><button className="btn secondary" onClick={()=>enquire(d)}>I'm interested</button></div></div></article>):<div className="empty">No dogs found. Try a different search.</div>}</div></section><section className="section" id="how"><div className="banner"><div><h2>Have a dog to share?</h2><p>Reach caring people looking for their perfect companion.</p></div><button className="btn secondary" onClick={()=>setShowForm(true)}>Create a free listing →</button></div></section></main><footer>© 2024 DogsLub · Built for responsible dog lovers · <a href="mailto:hello@dogslub.example">Contact us</a></footer>{showForm&&<div style={{position:'fixed',inset:0,background:'#17221c99',display:'grid',placeItems:'center',padding:20,zIndex:4}}><form onSubmit={addDog} style={{background:'white',padding:28,borderRadius:20,maxWidth:440,width:'100%',display:'grid',gap:12}}><h2 style={{margin:'0 0 5px',fontFamily:'Playfair Display'}}>List your dog</h2><input required name="name" placeholder="Dog's name"/><input required name="breed" placeholder="Breed"/><input required name="age" placeholder="Age"/><input required name="place" placeholder="City"/><input required name="price" placeholder="Price or adoption note"/><select name="type"><option>Adopt</option><option>Hire</option><option>Sell</option></select><div style={{display:'flex',gap:10}}><button className="btn primary" type="submit">Publish listing</button><button className="btn" type="button" onClick={()=>setShowForm(false)}>Cancel</button></div></form></div>}</>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
